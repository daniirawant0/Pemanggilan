<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aplikasi Pemanggilan - Sistem panggilan real-time antara pemanggil dan penerima">
  <title>Aplikasi Pemanggilan</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Landing Header -->
    <header class="landing-header">
      <div class="landing-logo" id="landing-logo">
        📞
      </div>
      <h1 class="landing-title">Aplikasi Pemanggilan</h1>
      <p class="landing-subtitle">Pilih peran Anda untuk memulai</p>
    </header>

    <!-- Role Selection Cards -->
    <div class="role-cards">
      <a href="pemanggil.html" class="role-card caller" id="role-caller">
        <div class="role-icon">📲</div>
        <h2 class="role-card-title">Pemanggil</h2>
        <p class="role-card-desc">
          Lakukan panggilan ke penerima dengan satu tombol. 
          Pantau status panggilan secara real-time.
        </p>
      </a>

      <a href="penerima.html" class="role-card receiver" id="role-receiver">
        <div class="role-icon">🔔</div>
        <h2 class="role-card-title">Penerima</h2>
        <p class="role-card-desc">
          Terima notifikasi panggilan dengan nada dering. 
          Kelola panggilan masuk dari pemanggil.
        </p>
      </a>
    </div>
  </div>

  <!-- Floating particles for visual appeal -->
  <canvas id="particles-canvas"></canvas>

  <script>
    // Simple particle animation background
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');

    canvas.style.position = 'fixed';
    canvas.style.top = '0';
    canvas.style.left = '0';
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    canvas.style.pointerEvents = 'none';
    canvas.style.zIndex = '0';

    let particles = [];
    const PARTICLE_COUNT = 50;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createParticle() {
      return {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        size: Math.random() * 2 + 0.5,
        opacity: Math.random() * 0.3 + 0.05,
        color: Math.random() > 0.5 ? '99, 102, 241' : '16, 185, 129'
      };
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(createParticle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.color}, ${p.opacity})`;
        ctx.fill();
      });

      // Draw connections
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 150) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(148, 163, 184, ${0.03 * (1 - dist / 150)})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    initParticles();
    animate();
  </script>
</body>
</html>
